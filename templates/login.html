<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #F4F1EB; /* Light cream background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            text-align: center;
            background-color: #FFFFFF; /* White box background */
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .login-container h1 {
            font-size: 2em;
            color: #457B9D; /* Muted blue */
            margin-bottom: 10px;
        }

        .login-container p {
            color: #495057; /* Dark gray */
            font-size: 1em;
            margin-bottom: 20px;
        }

        .login-container img {
            max-width: 100px;
            margin-bottom: 20px;
        }

        .login-container .twitch-button {
            background-color: #9146FF; /* Twitch purple */
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }

        .login-container .twitch-button:hover {
            background-color: #772CE8; /* Slightly darker Twitch purple */
        }

        .footer-text {
            margin-top: 30px;
            font-size: 0.9em;
            color: #666;
        }

        .footer-text a {
            color: #457B9D;
            text-decoration: none;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-container">
    <img src="assets/images/logo.jpg" alt="Sponsor a Hacker Logo">
    <h1>Welcome!</h1>
    <p>Login with Twitch to continue and connect with your tech community.</p>
    <a href="/auth/login/twitch" class="twitch-button">Login with Twitch</a>
    <p class="footer-text">
        By logging in, you agree to our <a href="/terms">Terms of Service</a> and <a href="/privacy">Privacy Policy</a>.
    </p>
</div>

</body>
</html>
